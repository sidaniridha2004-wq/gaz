name: Export video chunks

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-video-chunks.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Encode video into retrievable chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -f video.b64.part-* video.b64.manifest.txt
          base64 -w 0 video_2026-09-13_13-35-33.mp4 | split -b 700000 -d -a 2 - video.b64.part-
          {
            sha256sum video_2026-09-13_13-35-33.mp4
            wc -c video_2026-09-13_13-35-33.mp4
            ls -1 video.b64.part-*
          } > video.b64.manifest.txt

      - name: Commit chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video.b64.part-* video.b64.manifest.txt
          git commit -m "Temporarily export video for analysis"
          git push
