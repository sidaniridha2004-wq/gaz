name: Analyze reference video style

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-video-chunks.yml

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install analysis dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'transformers==4.40.2' torch torchvision pillow librosa opencv-python-headless scikit-learn

      - name: Analyze visuals, motion, scenes, and music
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p video-analysis/frames
          ffprobe -v error -show_entries format=duration,size,bit_rate:stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json video_2026-09-13_13-35-33.mp4 > video-analysis/metadata.json
          ffmpeg -hide_banner -loglevel error -i video_2026-09-13_13-35-33.mp4 -vn -ac 1 -ar 22050 -c:a pcm_s16le video-analysis/audio.wav
          for item in "0 0.0" "1 2.5" "2 5.0" "3 7.5" "4 10.0" "5 12.5" "6 14.0"; do
            set -- $item
            ffmpeg -hide_banner -loglevel error -ss "$2" -i video_2026-09-13_13-35-33.mp4 -frames:v 1 -vf "scale=384:-2" -q:v 3 "video-analysis/frames/frame-$1.jpg"
          done
          ffmpeg -hide_banner -i video_2026-09-13_13-35-33.mp4 -vf "select='gt(scene,0.15)',showinfo" -an -f null - 2> video-analysis/scene-raw.txt || true
          grep -oE 'pts_time:[0-9.]+' video-analysis/scene-raw.txt | sed 's/pts_time:/scene_change_seconds=/' > video-analysis/scenes.txt || true
          python .github/workflows/analyze_reference.py
          rm -f video-analysis/audio.wav video-analysis/scene-raw.txt
          sha256sum video_2026-09-13_13-35-33.mp4 > video-analysis/source-sha256.txt

      - name: Commit text analysis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A video-analysis
          git commit -m "Analyze reference video visuals and music"
          git push

# Analysis script is committed before this trigger.
